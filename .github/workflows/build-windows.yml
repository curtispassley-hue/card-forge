name: Build CardForge Studio 1.0 Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download pinned sample fonts
        run: python scripts/fetch_fonts.py

      - name: Verify offline OCR runtime
        run: python -c "from rapidocr import RapidOCR; import onnxruntime; RapidOCR(); print('RapidOCR / ONNX Runtime ready')"

      - name: Smoke test
        run: |
          python -m tests.smoke_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python main.py --self-test source-test.json
          if (Test-Path source-test.json) { Get-Content source-test.json }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build EXE
        run: pyinstaller --noconfirm --clean CardForge4D.spec

      - name: Scan extracted app with Microsoft Defender
        shell: pwsh
        run: |
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($status -and $status.AMServiceEnabled) {
            $scanner = Join-Path $env:ProgramFiles 'Windows Defender/MpCmdRun.exe'
            & $scanner -Scan -ScanType 3 -File "$PWD/dist/CardForge4D" -DisableRemediation
            $code = $LASTEXITCODE
            @{available=$true; exit_code=$code; definitions=$status.AntivirusSignatureVersion} | ConvertTo-Json | Set-Content defender-scan.json
            if ($code -ne 0) { throw "Defender did not report a clean scan: $code" }
          } else {
            @{available=$false; reason='Defender service is unavailable on this runner; scan not performed'} | ConvertTo-Json | Set-Content defender-scan.json
          }

      - name: Test packaged EXE offline
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'exe-test.json'
          $app = Start-Process dist\CardForge4D\CardForge4D.exe -ArgumentList '--self-test', $report -PassThru -WindowStyle Hidden
          if (-not $app.WaitForExit(180000)) { $app.Kill(); throw 'EXE self-test timed out' }
          if ($app.ExitCode -ne 0) { Get-Content $report; throw 'EXE self-test failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw 'EXE self-test did not pass' }
          Get-Content $report

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" installer/CardForgeStudio.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }

      - name: Test installation and removal
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'CardForge-installed-test'
          $setup = Start-Process dist/CardForgeStudio-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target" -PassThru -WindowStyle Hidden
          if (-not $setup.WaitForExit(180000)) { $setup.Kill(); throw 'Installation timed out' }
          if ($setup.ExitCode -ne 0) { throw 'Installation failed' }
          $report = Join-Path $PWD 'installer-test.json'
          $app = Start-Process "$target/CardForge4D.exe" -ArgumentList '--self-test', $report -PassThru -WindowStyle Hidden
          if (-not $app.WaitForExit(180000)) { $app.Kill(); throw 'Installed app timed out' }
          if ($app.ExitCode -ne 0) { Get-Content $report; throw 'Installed app self-test failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw 'Installed app test did not pass' }
          Get-Content $report
          $uninstaller = Start-Process "$target/unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru -WindowStyle Hidden
          if (-not $uninstaller.WaitForExit(120000)) { $uninstaller.Kill(); throw 'Uninstall timed out' }
          if ($uninstaller.ExitCode -ne 0 -or (Test-Path "$target/CardForge4D.exe")) { throw 'Uninstall failed' }

      - name: Create distributable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\CardForge4D release\CardForge4D -Recurse
          Copy-Item README.md release\README.md
          Copy-Item LICENSE.txt release\LICENSE.txt
          Copy-Item COMMERCIAL_SETUP.md release\COMMERCIAL_SETUP.md
          Compress-Archive -Path release\* -DestinationPath CardForge4D-Windows.zip -Force
          git archive --format=zip --output=CardForge4D-Source.zip HEAD
          $files = @('CardForge4D-Windows.zip', 'CardForge4D-Source.zip', 'dist/CardForgeStudio-Setup.exe')
          $files | ForEach-Object { $hash = Get-FileHash -Algorithm SHA256 $_; "$($hash.Hash.ToLower())  $([IO.Path]::GetFileName($_))" } | Set-Content -Encoding utf8 SHA256SUMS.txt

      - name: Publish tested release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'v1.0.0-rc.${{ github.run_number }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target '${{ github.sha }}' --prerelease --title 'CardForge Studio 1.0 Release Candidate' --notes-file RELEASE_NOTES_1_0.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag CardForge4D-Windows.zip CardForge4D-Source.zip dist/CardForgeStudio-Setup.exe exe-test.json installer-test.json defender-scan.json SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardForge4D-Windows
          path: |
            CardForge4D-Windows.zip
            CardForge4D-Source.zip
            defender-scan.json
            exe-test.json
            source-test.json
            installer-test.json
            dist/CardForgeStudio-Setup.exe
            SHA256SUMS.txt

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            *-test.json
            build/CardForge4D/warn-CardForge4D.txt
